spring.application.name=outfit-ai

# --- Database (MySQL, ligesom i undervisningen) ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/outfitai?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Browseren skal altid hente nyeste HTML/JS/CSS (ingen gammel cache) ---
spring.web.resources.cache.period=0

# --- Billeder op til 10 MB ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- AI (Google Gemini, gratis noegle fra aistudio.google.com) ---
# Saet din noegle som miljoevariabel: GEMINI_API_KEY=...
# Laeg ALDRIG noeglen direkte i denne fil / paa GitHub.
ai.api-key=${GEMINI_API_KEY:}
ai.model=gemini-3.5-flash-lite
